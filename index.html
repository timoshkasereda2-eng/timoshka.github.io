<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто хочет стать миллионером - ТЫ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-dark: #030718;
            --card-bg: #09102b;
            --border-blue: #1c3275;
            --gold-accent: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.5);
            --correct-green: #10b981;
            --wrong-red: #ef4444;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0a1338 0%, #02040d 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 140%;
            height: 140%;
            background: radial-gradient(ellipse at top, rgba(29, 78, 216, 0.25) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
        }

        /* Верхняя панель управления слева */
        .top-controls {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .top-btn {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-blue);
            border-radius: 20px;
            color: var(--gold-accent);
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restart-btn-top {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--wrong-red);
            color: #ff8a8a;
        }

        .card {
            background: rgba(9, 16, 43, 0.95);
            border: 1.5px solid var(--border-blue);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .prize-text {
            color: var(--gold-accent);
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .question-box {
            background: #0d173d;
            border: 1.5px solid var(--border-blue);
            border-radius: 16px;
            padding: 20px;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.4;
            min-height: 80px;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #0d173d;
            border: 1.5px solid var(--border-blue);
            border-radius: 30px;
            padding: 15px 20px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .option-prefix {
            color: var(--gold-accent);
            font-weight: 800;
        }

        .option-btn.selected {
            border-color: var(--gold-accent);
            background: rgba(245, 158, 11, 0.15);
            box-shadow: 0 0 20px var(--gold-glow);
            animation: pulse-gold 0.8s infinite alternate;
        }

        @keyframes pulse-gold {
            from { box-shadow: 0 0 10px var(--gold-glow); }
            to { box-shadow: 0 0 25px var(--gold-glow); }
        }

        .option-btn.correct {
            border-color: var(--correct-green) !important;
            background: rgba(16, 185, 129, 0.25) !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6) !important;
            color: #a7f3d0;
        }

        .option-btn.wrong {
            border-color: var(--wrong-red) !important;
            background: rgba(239, 68, 68, 0.25) !important;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6) !important;
            color: #fca5a5;
        }

        .lifelines {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .lifeline-btn {
            flex: 1;
            background: #0d173d;
            border: 1.5px solid var(--border-blue);
            border-radius: 20px;
            padding: 10px 6px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .lifeline-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #1e293b;
        }

        .sidebar-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 13, 0.85);
            display: flex;
            justify-content: flex-start;
            z-index: 100;
            transition: 0.3s;
        }

        .sidebar-content {
            width: 300px;
            height: 100%;
            background: #09102b;
            border-right: 2px solid var(--border-blue);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .ladder-section-title {
            color: var(--gold-accent);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 10px 0 4px 4px;
            letter-spacing: 1px;
        }

        .ladder-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: 700;
            color: var(--text-muted);
            font-size: 13px;
        }

        .ladder-item.active {
            background: rgba(245, 158, 11, 0.2);
            color: var(--gold-accent);
            border: 1px solid var(--gold-accent);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 13, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .chart-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 150px;
            margin-top: 15px;
            gap: 12px;
        }

        .chart-bar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            background: var(--border-blue);
            border-radius: 6px 6px 0 0;
            transition: height 0.8s ease-out;
        }

        .chart-bar.highlight {
            background: var(--gold-accent);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .hidden { display: none !important; }

        .result-screen {
            text-align: center;
            gap: 20px;
        }

        .restart-btn-glow {
            background: rgba(239, 68, 68, 0.2);
            border: 1.5px solid var(--wrong-red);
            color: #ff8a8a;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            border-radius: 30px;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .restart-btn-glow:active {
            box-shadow: 0 0 25px var(--wrong-red);
            background: rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <button class="top-btn restart-btn-top" onclick="startGame()">🔄</button>
        <button class="top-btn" onclick="toggleSettings()">⚙️</button>
        <button class="top-btn" onclick="toggleSidebar()">📊</button>
    </div>

    <div class="app-container">
        <!-- Игровой экран -->
        <div id="quiz-card" class="card">
            <div class="header-info">
                <span id="question-counter">ВОПРОС 1</span>
                <span id="prize-counter" class="prize-text">$100</span>
            </div>

            <div id="question-text" class="question-box">...</div>

            <div class="lifelines">
                <button id="fifty-btn" class="lifeline-btn" onclick="useFiftyFifty()">50:50</button>
                <button id="phone-btn" class="lifeline-btn" onclick="usePhone()">📞 Звонок</button>
                <button id="audience-btn" class="lifeline-btn" onclick="useAudience()">👥 Помощь зала</button>
            </div>

            <div id="options-container" class="options-list"></div>
        </div>

        <!-- Боковая панель лесенки (30 вопросов) -->
        <div id="sidebar-modal" class="sidebar-modal hidden" onclick="toggleSidebar()">
            <div class="sidebar-content" onclick="event.stopPropagation()">
                <h3 style="color: var(--gold-accent); text-align: center; margin-bottom: 5px;">ДЕНЕЖНАЯ ШКАЛА</h3>
                <div id="ladder-list"></div>
                <button class="option-btn" style="justify-content: center; margin-top: 10px;" onclick="toggleSidebar()">ЗАКРЫТЬ</button>
            </div>
        </div>

        <!-- Модальное окно НАСТРОЙКИ ЗВУКА -->
        <div id="settings-modal" class="modal hidden">
            <div class="card" style="width: 100%; max-width: 320px; text-align: center; gap: 15px;">
                <h3 style="color: var(--gold-accent);">НАСТРОЙКИ ЗВУКА</h3>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="font-size: 13px; color: var(--text-muted);">Громкость эффектов</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)" style="accent-color: var(--gold-accent); cursor: pointer;">
                </div>
                <button class="option-btn" style="justify-content: center;" onclick="toggleSettings()">СОХРАНИТЬ</button>
            </div>
        </div>

        <!-- Модальное окно ПОМОЩЬ ЗАЛА -->
        <div id="audience-modal" class="modal hidden">
            <div class="card" style="width: 100%; max-width: 340px;">
                <h3 style="text-align: center; font-size: 16px; color: var(--gold-accent);">МНЕНИЕ ЗАЛА</h3>
                <div class="chart-container">
                    <div class="chart-bar-wrap">
                        <span id="val-A" style="font-size: 11px;">0%</span>
                        <div id="bar-A" class="chart-bar" style="height: 0%;"></div>
                        <span style="font-weight: 800; color: var(--gold-accent);">A</span>
                    </div>
                    <div class="chart-bar-wrap">
                        <span id="val-B" style="font-size: 11px;">0%</span>
                        <div id="bar-B" class="chart-bar" style="height: 0%;"></div>
                        <span style="font-weight: 800; color: var(--gold-accent);">B</span>
                    </div>
                    <div class="chart-bar-wrap">
                        <span id="val-C" style="font-size: 11px;">0%</span>
                        <div id="bar-C" class="chart-bar" style="height: 0%;"></div>
                        <span style="font-weight: 800; color: var(--gold-accent);">C</span>
                    </div>
                    <div class="chart-bar-wrap">
                        <span id="val-D" style="font-size: 11px;">0%</span>
                        <div id="bar-D" class="chart-bar" style="height: 0%;"></div>
                        <span style="font-weight: 800; color: var(--gold-accent);">D</span>
                    </div>
                </div>
                <button class="option-btn" style="justify-content: center; margin-top: 15px;" onclick="closeModal('audience-modal')">ЗАКРЫТЬ</button>
            </div>
        </div>

        <!-- Модальное окно ЗВОНОК ДРУГУ (Джо Голдберг) -->
        <div id="phone-modal" class="modal hidden">
            <div class="card" style="width: 100%; max-width: 340px; text-align: center; gap: 15px;">
                <h3 style="font-size: 16px; color: var(--gold-accent);">ЗВОНОК ДЖО ГОЛДБЕРГУ</h3>
                <p id="phone-text" style="font-size: 14px; color: var(--text-muted); line-height: 1.4;"></p>
                <button class="option-btn" style="justify-content: center;" onclick="closeModal('phone-modal')">ПОНЯТНО</button>
            </div>
        </div>

        <!-- Результат -->
        <div id="result-card" class="card result-screen hidden">
            <h2 style="font-size: 24px; color: var(--wrong-red);">ИГРА ОКОНЧЕНА</h2>
            <div style="font-size: 13px; color: var(--text-muted);">ваш итоговый выигрыш</div>
            <div id="final-score" style="font-size: 36px; font-weight: 900; color: var(--gold-accent);">$0</div>
            <button class="restart-btn-glow" onclick="startGame()">НОВАЯ ИГРА</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let globalVolume = 0.5;

        function changeVolume(val) {
            globalVolume = parseFloat(val);
        }

        function playSound(type) {
            if (globalVolume <= 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            
            if (type === 'select') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
                gain.gain.setValueAtTime(0.3 * globalVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'correct') {
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                    gain.gain.setValueAtTime(0.3 * globalVolume, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.5);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.5);
                });
            } else if (type === 'wrong') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.8);
                gain.gain.setValueAtTime(0.4 * globalVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.8);
            }
        }

        const prizes = [

                {q: "На каком канале сериал транслировался до перехода на Netflix?", options: ["Lifetime", "HBO", "CW", "FX"], correct: 0},
                {q: "Какое реальное имя актера, сыгравшего Джо Голдберга?", options: ["Пенн Бэджли", "Иэн Сомерхолдер", "Чейс Кроуфорд", "Мэтт Смит"], correct: 0},
                {q: "Сколько всего эпизодов насчитывает первый сезон?", options: ["8", "10", "12", "13"], correct: 1},
                {q: "Какую именно книгу покупает Бен О'Рейлли в начале 1 сезона?", options: ["Гордость и предубеждение", "Великий Гэтсби", "Сборник стихов Эмили Дикинсон", "Цветы для Элджернона"], correct: 2},
                {q: "Какая марка и модель телефона была у Бек в 1 сезоне?", options: ["iPhone 6", "iPhone 7", "iPhone X", "Samsung"], correct: 1},
                {q: "В каком году вышла книга «You» Кэролайн Кепнес?", options: ["2012", "2014", "2016", "2018"], correct: 1},
                {q: "Какое второе имя у главного героя Джо Голдберга по книге?", options: ["Эдвард", "Джозеф", "У него нет второго имени", "Бенджамин"], correct: 2},
                {q: "Как звали девушку в финале 4 сезона, с которой Джо появляется как филантроп?", options: ["Кейт Локвуд", "Мэриен", "Леди Фиби", "Никто"], correct: 0},

                {q: "Какое точное количество людей Джо официально убил за первые 3 сезона?", options: ["Ровно 5", "Более 8", "Около 7-9 человек", "Ни одного"], correct: 2},
                {q: "Какая сцена из книги была полностью вырезана из 1 сезона сериала?", options: ["Встреча с отцом Бек", "Сцена в подвале", "Многочисленные внутренние монологи Джо о литературе", "Линия профессора Ники"], correct: 2},
                {q: "В каком городе родился Пенн Бэджли?", options: ["Балтимор", "Нью-Йорк", "Лос-Анджелес", "Сиэтл"], correct: 0},
                {q: "Как звали владельца элитного книжного магазина в 1 сезоне?", options: ["Мистер Муни", "Гораций", "Генри", "Пол"], correct: 0},
                {q: "Какое имя было у мамы Джо в книге?", options: ["Сэнди", "Мэри", "Элизабет", "Анна"], correct: 0},
                {q: "Какой породы была собака Пич Сэлинджер в сериале?", options: ["Кавалер-кинг-чарльз-спаниель", "Мопс", "Пудель", "Хаски"], correct: 0},
                {q: "Сколько дней Джо продержал Делайлу в клетке?", options: ["Ровно 3 дня", "Около недели", "Ровно 5 дней", "Точно не указано"], correct: 3},
                {q: "Как назывался отель/пансионат во 2 сезоне в Лос-Анджелесе?", options: ["Anavrin", "Sunset Vista", "Paramount Apartments", "Отел не имел вывески"], correct: 3},
                {q: "Какую премию упоминает Бек в университете?", options: ["Премия Фолкнера", "Стипендия факультета", "Творческий грант Адамса", "Не упоминалась"], correct: 3},
                {q: "Какое пиво пил сосед Мэтью в 3 сезоне?", options: ["Budweiser", "Heineken", "Corona", "Марка замазывалась в кадре"], correct: 3},
                {q: "Какая музыка играет на титрах пилотной серии?", options: ["Инди-мелодия", "Композиция Блейка Нили", "Поп-трек", "Эмбиент-саундтрек"], correct: 1},
                {q: "Какую профессию выбирала Бек до поэзии?", options: ["Журналистика", "Психология", "Маркетинг", "Не уточнялось"], correct: 3},
                {q: "Какая точная цифра указана на обложке первой книги «Ты»?", options: ["Там нет цифр", "Издание первое", "Реальные события", "Только слово 'You'"], correct: 3}
            ]
        };

        let currentQuestions = [];
        let currentQuestion = 0;
        let score = "$0";
        let isLocked = false;

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function startGame() {
            const easyPart = shuffle(banks.easy).slice(0, 10);
            const mediumPart = shuffle(banks.medium).slice(0, 10);
            const hardPart = shuffle(banks.hard).slice(0, 10);
            
            // Перемешиваем сами вопросы и перемешиваем варианты ответов внутри каждого вопроса
            currentQuestions = [...easyPart, ...mediumPart, ...hardPart].map(q => {
                let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.correct }));
                optionsWithIndex = shuffle(optionsWithIndex);
                const newCorrectIndex = optionsWithIndex.findIndex(item => item.isCorrect);
                return {
                    q: q.q,
                    options: optionsWithIndex.map(item => item.text),
                    correct: newCorrectIndex
                };
            });

            currentQuestion = 0;
            score = "$0";

            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            
            document.getElementById('fifty-btn').disabled = false;
            document.getElementById('phone-btn').disabled = false;
            document.getElementById('audience-btn').disabled = false;

            updateLadder();
            loadQuestion();
        }

        function updateLadder() {
            const container = document.getElementById('ladder-list');
            container.innerHTML = '';
            
            const sections = [
                { title: "🟢 Сложные вопросы (Сложный уровень)", start: 20, end: 29 },
                { title: "🟡 Средние вопросы (Средний уровень)", start: 10, end: 19 },
                { title: "🟢 Лёгкие вопросы (Лёгкий уровень)", start: 0, end: 9 }
            ];

            sections.forEach(sec => {
                const titleEl = document.createElement('div');
                titleEl.className = 'ladder-section-title';
                titleEl.innerText = sec.title;
                container.appendChild(titleEl);

                for (let i = sec.end; i >= sec.start; i--) {
                    const item = document.createElement('div');
                    item.className = `ladder-item ${i === currentQuestion ? 'active' : ''}`;
                    item.innerHTML = `<span>Вопрос ${i + 1}</span> <span>${prizes[i]}</span>`;
                    container.appendChild(item);
                }
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar-modal').classList.toggle('hidden');
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function loadQuestion() {
            isLocked = false;
            updateLadder();
            const q = currentQuestions[currentQuestion];
            document.getElementById('question-counter').innerText = `ВОПРОС ${currentQuestion + 1} из 30`;
            document.getElementById('prize-counter').innerText = prizes[currentQuestion];
            document.getElementById('question-text').innerText = q.q;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const prefixes = ["A", "B", "C", "D"];
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-prefix">${prefixes[idx]}:</span> <span>${opt}</span>`;
                btn.onclick = () => handleAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (isLocked) return;
            isLocked = true;

            playSound('select');
            btnElement.classList.add('selected');

            const q = currentQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.options-list button');

            setTimeout(() => {
                btnElement.classList.remove('selected');
                if (selectedIndex === q.correct) {
                    btnElement.classList.add('correct');
                    playSound('correct');
                    score = prizes[currentQuestion];

                    setTimeout(() => {
                        currentQuestion++;
                        if (currentQuestion < currentQuestions.length) {
                            loadQuestion();
                            toggleSidebar();
                            setTimeout(() => toggleSidebar(), 3000);
                        } else {
                            showResults();
                        }
                    }, 2500);
                } else {
                    btnElement.classList.add('wrong');
                    buttons[q.correct].classList.add('correct');
                    playSound('wrong');

                    setTimeout(() => {
                        showResults();
                    }, 2500);
                }
            }, 2000);
        }

        function useFiftyFifty() {
            document.getElementById('fifty-btn').disabled = true;
            const q = currentQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.options-list button');
            let removed = 0;

            buttons.forEach((btn, idx) => {
                if (idx !== q.correct && removed < 2) {
                    btn.style.opacity = '0.2';
                    btn.style.pointerEvents = 'none';
                    removed++;
                }
            });
        }

        function usePhone() {
            document.getElementById('phone-btn').disabled = true;
            const q = currentQuestions[currentQuestion];
            const prefixes = ["A", "B", "C", "D"];
            
            const suggestIndex = Math.random() < 0.7 ? q.correct : (q.correct + 1) % 4;
            const suggestLetter = prefixes[suggestIndex];

            document.getElementById('phone-text').innerText = `Алло... Слушай, я сейчас занят книгами, но... я внимательно слежу за тобой. Мне кажется, тебе стоит выбрать вариант ${suggestLetter}. Надеюсь, ты не ошибешься. Ради твоего же блага.`;
            document.getElementById('phone-modal').classList.remove('hidden');
        }

        // Помощь зала: полностью случайное распределение, зал часто ошибается и выдает разные комбинации
        function useAudience() {
            document.getElementById('audience-btn').disabled = true;

            let p = [
                Math.floor(Math.random() * 60) + 5,
                Math.floor(Math.random() * 60) + 5,
                Math.floor(Math.random() * 60) + 5,
                Math.floor(Math.random() * 60) + 5
            ];

            let sum = p[0] + p[1] + p[2] + p[3];
            p = p.map(val => Math.round((val / sum) * 100));
            let diff = 100 - (p[0] + p[1] + p[2] + p[3]);
            p[0] += diff;

            let maxVal = Math.max(...p);

            ['A', 'B', 'C', 'D'].forEach((letter, idx) => {
                let val = p[idx];
                document.getElementById(`val-${letter}`).innerText = `${val}%`;
                const bar = document.getElementById(`bar-${letter}`);
                bar.style.height = `${val}%`;
                
                if (val === maxVal) {
                    bar.classList.add('highlight');
                } else {
                    bar.classList.remove('highlight');
                }
            });

            document.getElementById('audience-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function showResults() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;
        }

        startGame();
    </script>
