<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: rgba(18, 25, 46, 0.95);
            --neon-blue: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.4);
            --border-color: #1e3a7a;
            --text-main: #ffffff;
            --text-muted: #7f95d1;
            --correct-green: #00e676;
            --wrong-red: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #101c38 0%, #050814 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            height: 36px;
        }

        .top-btn:active {
            transform: scale(0.95);
            border-color: var(--neon-blue);
            color: #fff;
        }

        .restart-btn {
            background: rgba(255, 82, 82, 0.15);
            border: 1.5px solid var(--wrong-red);
            color: #ff8a8a;
            box-shadow: 0 0 12px rgba(255, 82, 82, 0.4);
        }

        .restart-btn:active {
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 18px var(--wrong-red);
        }

        .card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px var(--neon-glow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            color: #fff;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(25, 35, 65, 0.6);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:active {
            transform: scale(0.98);
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--neon-blue);
        }

        .option-btn.correct {
            background: rgba(0, 230, 118, 0.2);
            border-color: var(--correct-green);
            color: #69f0ae;
        }

        .option-btn.wrong {
            background: rgba(255, 82, 82, 0.2);
            border-color: var(--wrong-red);
            color: #ff8a8a;
        }

        .lifelines {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .lifeline-btn {
            flex: 1;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 10px;
            color: #93c5fd;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .lifeline-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        .result-screen {
            text-align: center;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
        }

        .result-score {
            font-size: 40px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-glow);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Экран выбора сложности -->
        <div id="difficulty-card" class="card result-screen">
            <div class="result-title" style="font-size: 22px;">Викторина «ТЫ» (YOU)</div>
            <div style="color: var(--text-muted); font-size: 14px;">Выберите уровень сложности:</div>
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                <button class="option-btn" style="text-align: center; font-weight: 700; border-color: var(--correct-green); color: #69f0ae;" onclick="selectDifficulty('easy')">🟢 Лёгкий (10 вопросов)</button>
                <button class="option-btn" style="text-align: center; font-weight: 700; border-color: var(--neon-blue); color: #93c5fd;" onclick="selectDifficulty('medium')">🟡 Средний (10 вопросов)</button>
                <button class="option-btn" style="text-align: center; font-weight: 700; border-color: var(--wrong-red); color: #ff8a8a;" onclick="selectDifficulty('hard')">🔴 Сложный (10 вопросов)</button>
            </div>
        </div>

        <!-- Верхняя панель (скрыта на выборе сложности) -->
        <div id="top-bar" class="top-bar hidden">
            <div id="score-display" class="top-btn">🏆 Сет: $0</div>
            <button class="top-btn restart-btn" onclick="goToMenu()">🔄 Меню</button>
        </div>

        <!-- Карточка викторины -->
        <div id="quiz-card" class="card hidden">
            <div class="quiz-header">
                <span id="question-counter">Вопрос 1 из 10</span>
                <span id="timer">⏱ 30с</span>
            </div>
            
            <div id="question-container" class="question-text">
                Загрузка вопроса...
            </div>

            <div id="options-container" class="options-list">
                <!-- Варианты ответов -->
            </div>

            <div class="lifelines">
                <button id="fifty-btn" class="lifeline-btn" onclick="useFiftyFifty()">50 / 50</button>
                <button id="audience-btn" class="lifeline-btn" onclick="useAudience()">👥 Помощь зала</button>
            </div>
        </div>

        <!-- Экран результатов -->
        <div id="result-card" class="card result-screen hidden">
            <div class="result-title">Викторина окончена!</div>
            <div style="color: var(--text-muted); font-size: 14px;">Ваш итоговый выигрыш:</div>
            <div id="final-score" class="result-score">$0</div>
            <button class="option-btn" style="text-align: center; background: var(--neon-blue); font-weight: 700;" onclick="goToMenu()">В главное меню</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const prizes = ["$1,000", "$5,000", "$10,000", "$25,000", "$50,000", "$100,000", "$250,000", "$500,000", "$1,000,000", "$2,000,000"];

        // База из 25 вопросов для каждого уровня
        const banks = {
            easy: [
                {q: "Как звали главного героя-убийцу в первом сезоне сериала «Ты»?", options: ["Джо Голдберг", "Дэн Смит", "Райан Гудман", "Кэвин Вуд"], correct: 0},
                {q: "В каком городе работал книжный магазин, где начинаются события 1 сезона?", options: ["Лос-Анджелес", "Нью-Йорк", "Чикаго", "Бостон"], correct: 1},
                {q: "Как звали девушку, в которую Джо влюбился в первом сезоне?", options: ["Лав Куинн", "Мэриен Беллами", "Гвиневра Бек", "Натали Пратт"], correct: 2},
                {q: "Какое имя берет Джо, переехав в Лос-Анджелес во втором сезоне?", options: ["Уилл Беттельгейм", "Пол Браун", "Джонатан Мур", "Чарли Брэдли"], correct: 0},
                {q: "Кто оказывается главным манипулятором и убийцей во втором сезоне?", options: ["Кандис Стоун", "Лав Куинн", "Делайла Куинн", "Фифти"], correct: 1},
                {q: "Как называется элитный пригород, куда переезжают Джо и Лав в третьем сезоне?", options: ["Мадрина", "Брекли", "Карлсбад", "Фрэдрик"], correct: 0},
                {q: "Кто является соседкой Джо и Лав, вызывающей у Джо интерес в 3 сезоне?", options: ["Натали Пратт", "Шерри Конрад", "Мэттью Ингленд", "Мэриен Беллами"], correct: 0},
                {q: "В каком европейском городе разворачивается первая половина четвёртого сезона?", options: ["Париж", "Рим", "Лондон", "Берлин"], correct: 2},
                {q: "Как назывался анонимный сталкер, преследовавший Джо в Лондоне в 4 сезоне?", options: ["Убийца из Кит-Сот", "Богатый мажор", "Профессор Рис Монро", "Адам Пратт"], correct: 2},
                {q: "Какая главная моральная тема проходит через весь сериал «Ты»?", options: ["Романтическая любовь спасает мир", "Опасность токсичной одержимости под маской заботы", "Польза соцсетей", "Успешный книжный бизнес"], correct: 1},
                {q: "Кем работал Джо в книжном магазине?", options: ["Директором", "Управляющим / клерком", "Охранником", "Уборщиком"], correct: 1},
                {q: "Как звали лучшую подругу Бек в первом сезоне?", options: ["Пич Сэлинджер", "Анника", "Линн", "Все варианты верны"], correct: 3},
                {q: "Что Джо часто использовал для слежки за своими жертвами?", options: ["Социальные сети и окна", "Дроны с камерами", "Частных детективов", "Спутник"], correct: 0},
                {q: "Какой стеклянный предмет является фирменным 'инструментом' Джо?", options: ["Стеклянная витрина для книг", "Звуконепроницаемая стеклянная камера", "Стеклянный шар", "Аквариум"], correct: 1},
                {q: "Как звали сына Джо и Лав в третьем сезоне?", options: ["Генри", "Эдвард", "Артур", "Леонард"], correct: 0},
                {q: "Кем работала Лав Куинн?",options: ["Шеф-поваром и пекарем", "Учительницей", "Журналисткой", "Актрисой"], correct: 0},
                {q: "Какое хобби было у Форти, брата Лав?", options: ["Писательство и сценарии", "Профессиональный спорт", "Программирование", "Рисование"], correct: 0},
                {q: "Куда Джо отправляется в самом конце четвертого сезона?", options: ["Снова в Нью-Йорк", "В Лондон навсегда", "В Париж", "В Токио"], correct: 0},
                {q: "Как звали студентку Джо в четвертом сезоне, к которой он испытывал симпатию?", options: ["Кейт Локвуд", "Надия Сарвар", "Фиби", "Леди Мари"], correct: 1},
                {q: "Какое животное было у Пич Сэлинджер?", options: ["Собака", "Кот", "Попугай", "У нее не было питомца"], correct: 0},
                {q: "Кто подставил Джо в конце первого сезона?", options: ["Бек (в дневнике)", "Кандис", "Доктор Ники", "Никто"], correct: 0},
                {q: "Какое блюдо часто готовила Лав для устранения неугодных людей?",options: ["Особые кексы с отравой", "Лазанью", "Пирог с ядовитыми грибами", "Суп"], correct: 2},
                {q: "Как звали мужа Лав до Джо?", options: ["Джеймс", "Мэтью", "Пол", "Том"], correct: 0},
                {q: "Какую книгу Джо считал своей любимой в детстве?", options: ["Граф Монте-Кристо", "Преступление и наказание", "Приключения Тома Сойера", "Над пропастью во ржи"], correct: 0},
                {q: "В каком сезоне появляется персонаж Мариен Беллами?", options: ["1 сезон", "2 сезон", "3 сезон", "4 сезон"], correct: 2}
            ],
            medium: [
                {q: "Какую реальную книгу дал почитать Джо своему ученику Пако в 1 сезоне?", options: ["Преступление и наказание", "Война и мир", "Великий Гэтсби", "Одиссея"], correct: 0},
                {q: "Как звали детектива, который расследовал исчезновение Бек в 1 сезоне?", options: ["Дэниелс", "Куинн", "Манкивич", "Элкинс"], correct: 2},
                {q: "Какую профессию имела мать Джо, судя по воспоминаниям из детства?", options: ["Медсестра", "Официантка", "У него не было матери", "Она бросила его в приюте (на самом деле воспитывался в интернате/была суровой)"], correct: 3},

                {q: "Какой фальшивый диагноз поставил себе Джо во 2 сезоне, чтобы внедриться в клинику?", options: ["Амнезия", "Опухоль мозга", "Агорафобия", "Наркотическая зависимость"], correct: 1},
                {q: "Как звали опекуна Джо в детском доме, оставившего у него психологическую травму?", options: ["Мистер Муни", "Доктор Ники", "Рон", "Директор Карл"], correct: 0},
                {q: "Какая деталь выдала Джо в квартире Пич Сэлинджер?", options: ["Его бейсболка", "Баночка с его мочой для анализов", "Его блокнот", "Его кредитка"], correct: 1},
                {q: "Какой национальности был охранник Рон, избивавший маму Клаудии?", options: ["Он был военным / бывшим копом", "Испанец", "Ирландец", "Афроамериканец"], correct: 0},
                {q: "Какое имя на самом деле носил фальшивый Уилл Беттельгейм?", options: ["Питер", "Тони", "Бетт", "Мэтт"], correct: 0},
                {q: "В какой книге Джо прятал заначку и ключ от стеклянной клетки в 1 сезоне?", options: ["Тайная история", "Властелин Колец", "Джейн Эйр", "Никакой, в полу"], correct: 0},
                {q: "Как звали мужа Делайлы, который погиб в драке?", options: ["У него не было мужа", "Хендерсон", "Уильям", "Дэвид"], correct: 0},
                {q: "Какое прозвище дал Джо комику-педофилу Хендерсону во 2 сезоне?", options: ["Хенди", "Монстр в свитере", "Грязный комик", "Он его не называл прозвищем"], correct: 1},
                {q: "Кто застрелил Лав Куинн в финале 3 сезона?", options: ["Джо", "Мэтью Ингленд", "Она сама себя", "Никто, она выжила"], correct: 0},
                {q: "Какой бизнес пытались вести Джо и Лав в 3 сезоне в пригороде?", options: ["Пекарню-кафе", "Книжный ларек", "Ферму", "Цветочный магазин"], correct: 0},
                {q: "Кем приходился Реддингтон персонажу Фиби в 4 сезоне?", options: ["Ее телохранителем / другом", "Ее дядей", "Ее мужем", "Ее адвокатом"], correct: 0},
                {q: "Какая болезнь была у сына Джо (Генри) в 3 сезоне?", options: ["Корь", "Коклюш (скарлатина)", "Аллергия на арахис", "Воспаление уха"], correct: 1},
                {q: "Куда Джо сбежал из пригорода после финала 3 сезона?", options: ["В Париж через Ликеру", "В Лондон", "В Канаду", "В Мексику"], correct: 1},
                {q: "Как звали отца Лав и Форти?", options: ["Рэй Куинн", "Джордж Куинн", "Артур Куинн", "Чарльз Куинн"], correct: 0},
                {q: "Какую книгу писал Форти Куинн во 2 сезоне?", options: ["Сценарий по мотивам жизни Бек", "Автобиографию", "Фантастический роман", "Кулинарную книгу"], correct: 0},
                {q: "Кто узнал Джо в Лондоне самым первым в 4 сезоне?", options: ["Малкольм", "Рис Монро", "Кейт", "Никто"], correct: 0},
                {q: "Какое прозвище пресса дала серийному убийце в Лондоне в 4 сезоне?", options: ["Убийца из Ист-Энда", "Рыцарь-убийца", "Убийца из высшего света (Eat the Rich)", "Британский мясник"], correct: 2},
                {q: "Какой предмет Джо оставил на месте преступления в доме Бек, ставший уликой?", options: ["Кольцо", "Часы", "Очки", "Зажигалку"], correct: 1},
                {q: "Как звали частного детектива, которого наняла семья Куинн для поисков Джо?", options: ["Миллер", "Куин", "Пенни", "Берт"], correct: 0},
                {q: "В каком году вышел самый первый сезон сериала «Ты»?", options: ["2016", "2017", "2018", "2019"], correct: 2},
                {q: "Какая актриса исполнила роль Лав Куинн?", options: ["Виктория Педретти", "Элизабет Леил", "Дженна Ортега", "Шарлотта Ричи"], correct: 0}
            ],
            hard: [
                {q: "Какая точная марка и модель телефона была у Бек в 1 сезоне?", options: ["iPhone 6", "iPhone 7", "iPhone X", "Samsung Galaxy"], correct: 1},
                {q: "В какой именно аудитории университета Бек читала свое стихотворение в 1 сезоне?", options: ["Аудитория 304", "Аудитория 4B", "Корпус гуманитарных наук, ауд. 21", "Номер точной аудитории в сериале не назывался прямо"], correct: 3},
                {q: "Какое реальное имя у актера, сыгравшего Джо Голдберга?", options: ["Пенн Бэджли", "Иэн Сомерхолдер", "Чейс Кроуфорд", "Мэтт Смит"], correct: 0},
                {q: "Сколько всего эпизодов насчитывает первый сезон сериала «Ты»?", options: ["8", "10", "12", "13"], correct: 1},
                {q: "На каком канале или стриминге сериал транслировался изначально до перехода на Netflix?", options: ["Lifetime", "HBO", "CW", "FX"], correct: 0},
                {q: "Какая точная цифра указана в книге Кэролайн Кепнес на обложке оригинального романа «Ты»?", options: ["Там нет цифр", "Издание первое", "Роман написан по реальным событиям (выдумка)", "Название книги состоит только из слова 'You'"], correct: 3},
                {q: "Какую именно книгу покупает Бен О'Рейлли в самом начале 1 сезона перед встречей с Бек?", options: ["«Гордость и предубеждение»", "«Великий Гэтсби»", "Сборник стихов Эмили Дикинсон", "«Цветы для Элджернона»"], correct: 2},
                {q: "Как звали владельца элитного книжного магазина в 1 сезоне, у которого работал Джо?", options: ["Мистер Муни (настоящее имя в титрах: Рон Муни)", "Гораций (Mr. Mooney / полный титул в книге: Джордж)", "Генри Муни", "Имя владельца по сюжету — мистер Муни, полного имени не было"], correct: 3},
                {q: "Какое точное имя у матери Джо, которое упоминается в редких флешбэках?", options: ["Сэнди", "Мэри", "Элизабет", "В сериале её называют просто 'мама' (в книге — Сэнди)"], correct: 3},
                {q: "Какая литературная премия упоминается в контексте университетских успехов Бек?", options: ["Премия имени Фолкнера", "Стипендия факультета", "Творческий грант имени Адамса", "В сериале не упоминалась конкретная премия"], correct: 3},
                {q: "Какое точное название у пансионата, где прятался Джо во 2 сезоне в Лос-Анджелесе?", options: ["Anavrin", "Sunset Vista", "Paramount Apartments", "Anavrin — это магазин, а отель не имел вывески"], correct: 3},
                {q: "Сколько дней Джо продержал в стеклянной клетке Делайлу Куинн?", options: ["Ровно 3 дня", "Около недели", "Ровно 5 дней", "Точное количество дней в диалогах не акцентировалось"], correct: 3},
                {q: "Какую марку пива предпочитал пить сосед Мэтью в 3 сезоне?", options: ["Budweiser", "Heineken", "Corona", "Марка пива в кадре намеренно замазывалась"], correct: 3},
                {q: "Как звали собаку Пич Сэлинджер, которая пострадала от рук Джо?", options: ["Зузу", "Бак", "Пончик", "У нее не было собаки, была кошка по кличке... (в книге была собака, в сериале пес породы кавалер-кинг-чарльз-спаниель без имени)"], correct: 3},
                {q: "Какое точное количество людей Джо официально убил за первые 3 сезона (по сюжету сериала)?", options: ["Ровно 5", "Более 8", "Точно не подсчитывалось, около 7-9 человек", "Ни одного, это всё самооборона"], correct: 2},
                {q: "Кто написал оригинальную серию книг, по которой снят сериал?", options: ["Кэролайн Кепнес", "Стивен Кинг", "Гиллиан Флинн", "Дэн Браун"], correct: 0},
                {q: "В каком году вышла в печать первая книга «Ты» (You)?", options: ["2012", "2014", "2016", "2018"], correct: 1},
                {q: "Какая сцена из книги была полностью вырезана из первого сезона сериала?", options: ["Встреча Джо с отцом Бек", "Сцена в подвале с книгами", "Многочисленные внутренние монологи Джо о литературе", "Сюжетная линия с профессором Ники была короче в книге"], correct: 2},
                {q: "Какое второе имя у главного героя Джо Голдберга по книге?", options: ["Эдвард", "Джозеф (полное имя)", "У него нет второго имени", "Бенджамин"], correct: 2},
                {q: "Кто озвучивает закадровый голос (мысли Джо) на протяжении всех сезонов?", options: ["Пенн Бэджли", "Приглашенный актер озвучки", "Режиссер сериала", "Никто, это запись студии"], correct: 0},
                {q: "Как звали девушку в финале 4 сезона, с которой Джо появляется на публике как признанный филантроп?", options: ["Кейт Локвуд", "Мэриен", "Леди Фиби", "Никто, он остался один"], correct: 0},
                {q: "Какая общая черта объединяет практически всех главных женских персонажей, в которых влюблялся Джо?", options: ["Все они писательницы", "Все они имеют скрытые психологические травмы или тайны", "Все они богаты", "Все они блондинки"], correct: 1},
                {q: "Какой музыкальный трек играет на финальных титрах пилотной серии 1 сезона?", options: ["Трогательная инди-мелодия", "Композиция Блейка Нили", "Популярный поп-трек 80-х", "В сериале титры идут под эмбиент-саундтрек"], correct: 1},
                {q: "Какую профессию изначально выбирала для себя Бек до того, как увлеклась поэзией?", options: ["Журналистика", "Психология", "Маркетинг", "В сценарии этого не уточнялось"], correct: 3},
                {q: "Какой фирменный элемент гардероба стал мемом среди фанатов Джо Голдберга?", options: ["Черная бейсболка", "Синяя кепка", "Темная кепка и кепка с козырьком для маскировки", "Шерстяной шарф"], correct: 2}
            ]
        };

        let currentDifficulty = 'easy';
        let currentQuestions = [];
        let currentQuestion = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 30;

        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectDifficulty(diff) {
            currentDifficulty = diff;
            // Берем случайные 10 вопросов из выбранного банка на 25 штук
            currentQuestions = shuffle(banks[diff]).slice(0, 10);
            
            document.getElementById('difficulty-card').classList.add('hidden');
            document.getElementById('top-bar').classList.remove('hidden');
            startQuiz();
        }

        function goToMenu() {
            clearInterval(timerInterval);
            document.getElementById('top-bar').classList.add('hidden');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('difficulty-card').classList.remove('hidden');
        }

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            document.getElementById('fifty-btn').disabled = false;
            document.getElementById('audience-btn').disabled = false;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer').innerText = `⏱ ${timeLeft}с`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `⏱ ${timeLeft}с`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1);
                }
            }, 1000);

            const q = currentQuestions[currentQuestion];
            document.getElementById('question-counter').innerText = `Вопрос ${currentQuestion + 1} из ${currentQuestions.length}`;
            document.getElementById('question-container').innerText = q.q;
            document.getElementById('score-display').innerText = `🏆 Сет: ${currentQuestion === 0 ? '$0' : prizes[currentQuestion - 1]}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(index);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const q = currentQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.options-list button');

            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === q.correct) {
                buttons[selectedIndex].classList.add('correct');
                score = prizes[currentQuestion];
                setTimeout(() => {
                    currentQuestion++;
                    if (currentQuestion < currentQuestions.length) {
                        loadQuestion();
                    } else {
                        showResults();
                    }
                }, 1000);
            } else {
                if (selectedIndex !== -1) {
                    buttons[selectedIndex].classList.add('wrong');
                }
                buttons[q.correct].classList.add('correct');
                setTimeout(() => {
                    showResults();
                }, 1500);
            }
        }

        function useFiftyFifty() {
            document.getElementById('fifty-btn').disabled = true;
            const q = currentQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.options-list button');
            let removed = 0;
            
            buttons.forEach((btn, index) => {
                if (index !== q.correct && removed < 2) {
                    btn.style.opacity = '0.2';
                    btn.disabled = true;
                    removed++;
                }
            });
        }

        // Помощь зала: строго 60% за неправильный и 40% за правильный
        function useAudience() {
            document.getElementById('audience-btn').disabled = true;
            const q = currentQuestions[currentQuestion];
            const buttons = document.querySelectorAll('.options-list button');
            
            let incorrectIndices = [];
            buttons.forEach((btn, idx) => {
                if (idx !== q.correct) incorrectIndices.push(idx);
            });
            
            const wrongIdx = incorrectIndices[Math.floor(Math.random() * incorrectIndices.length)];
            
            alert(`📊 Результаты голосования зала:\n\n• Вариант "${buttons[q.correct].innerText}": 40% зала\n• Вариант "${buttons[wrongIdx].innerText}": 60% зала (Мнение большинства)`);
        }

        function showResults() {
            clearInterval(timerInterval);
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('final-score').innerText = score || "$0";
        }

        function restartQuiz() {
            // Перезапуск с тем же уровнем сложности, но с новой рандомной выборкой вопросов
            selectDifficulty(currentDifficulty);
        }
    </script>
