<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #080d1a;
            --card-bg: rgba(18, 25, 46, 0.95);
            --neon-blue: #3b82f6;
            --neon-glow: rgba(59, 130, 246, 0.4);
            --border-color: #1e3a7a;
            --text-main: #ffffff;
            --text-muted: #7f95d1;
            --correct-green: #00e676;
            --wrong-red: #ff5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #101c38 0%, #050814 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Top Bar Controls */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            height: 36px;
        }

        .top-btn:active {
            transform: scale(0.95);
            border-color: var(--neon-blue);
            color: #fff;
        }

        .settings-btn {
            border-radius: 50%;
            width: 36px;
            height: 36px;
            padding: 0;
            justify-content: center;
            font-size: 16px;
        }

        /* Sound Control Pill */
        .sound-pill {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .sound-pill span {
            font-size: 14px;
            cursor: pointer;
        }

        .sound-slider {
            width: 70px;
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        .questions-pill {
            background: var(--card-bg);
            border: 1.5px solid #2a4b8d;
            border-radius: 20px;
            padding: 6px 14px;
            color: #60a5fa;
            font-size: 11px;
            font-weight: 800;
            height: 36px;
            display: flex;
            align-items: center;
        }

        .btn-restart { border-color: #3b5998; color: #8bb2f9; }
        .btn-reset { border-color: #7a2e43; color: #f98b9e; }

        /* Lifelines Row */
        .lifelines-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 2px;
        }

        .lifeline-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: #6d93e6;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px var(--neon-glow);
            transition: all 0.2s;
        }

        .lifeline-btn:not(.used):active {
            transform: scale(0.9);
            background: var(--neon-blue);
            color: white;
        }

        .lifeline-btn.used {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #333;
        }

        .lifeline-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Question Box */
        .question-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 1px;
            padding: 0 4px;
        }

        .question-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 24px;
            padding: 24px 20px;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 15px rgba(59,130,246,0.1);
        }

        /* Answers Grid */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        @media(min-width: 500px) {
            .answers-grid {
                grid-template-columns: 1fr 1fr; /* 2 колонки на широких экранах планшета */
            }
        }

        .answer-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: left;
            min-height: 54px;
        }

        .answer-btn:not(.disabled):not(.hidden-opt):active {
            transform: scale(0.98);
            border-color: var(--neon-blue);
            background: rgba(59, 130, 246, 0.2);
        }

        .answer-prefix {
            color: #5882e6;
            font-weight: 800;
            margin-right: 10px;
            font-size: 14px;
            flex-shrink: 0;
        }

        .answer-btn.correct {
            background: rgba(0, 230, 118, 0.2) !important;
            border-color: var(--correct-green) !important;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4) !important;
        }

        .answer-btn.wrong {
            background: rgba(255, 82, 82, 0.2) !important;
            border-color: var(--wrong-red) !important;
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.4) !important;
        }

        .answer-btn.hidden-opt {
            visibility: hidden;
            pointer-events: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(3, 6, 15, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0f172a;
            border: 2px solid var(--neon-blue);
            border-radius: 24px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 30px var(--neon-glow);
        }

        .modal-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid #3b82f6;
            margin: 0 auto 12px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.5;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-style: italic;
        }

        .modal-close-btn {
            background: var(--neon-blue);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 10px 24px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Bar Controls (как на ваших скриншотах) -->
        <div class="top-bar">
            <button class="top-btn settings-btn" id="settingsBtn" title="Настройки">⚙️</button>
            
            <div class="sound-pill">
                <span id="soundIcon">🔊</span>
                <input type="range" min="0" max="1" step="0.05" value="0.2" class="sound-slider" id="soundSlider">
            </div>

            <div class="questions-pill" id="questionsPill">ВОПРОСОВ: 205</div>
            <button class="top-btn btn-restart" id="restartBtn">РЕСТАРТ</button>
            <button class="top-btn btn-reset" id="resetHistoryBtn">СБРОС ИСТОРИИ</button>
        </div>

        <!-- Lifelines Row (50:50, Звонок, Помощь зала) -->
        <div class="lifelines-container">
            <button class="lifeline-btn" id="lifeline5050" title="50:50">
                <span style="font-weight: 900; font-size: 12px;">50:50</span>
            </button>
            <button class="lifeline-btn" id="lifelineCall" title="Звонок другу">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </button>
            <button class="lifeline-btn" id="lifelineAudience" title="Помощь зала">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </button>
        </div>

        <!-- Question Meta -->
        <div class="question-meta">
            <span id="questionNumText">ВОПРОС 1</span>
            <span id="scoreText">$100</span>
        </div>

        <!-- Question Card -->
        <div class="question-card" id="questionBox">
            Загрузка вопроса...
        </div>

        <!-- Answers Grid -->
        <div class="answers-grid" id="answersGrid">
            <!-- Кнопки ответов рендерятся через JS -->
        </div>
    </div>

    <!-- Modal Dialog -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-card">
            <div class="modal-avatar" id="modalAvatar">💡</div>
            <div class="modal-title" id="modalTitle">Подсказка</div>
            <div class="modal-body" id="modalBody">Текст подсказки...</div>
            <button class="modal-close-btn" id="closeModalBtn">Понятно</button>
        </div>
    </div>

    <script>
        // Init Telegram Web App
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // База вопросов (по мотивам сериала «Ты» и игр)
        const rawQuestions = [
            {
                q: "В каком книжном магазине в Нью-Йорке работал Джо Голдберг в 1 сезоне?",
                correct: "Mooney's",
                wrongs: ["Shakespeare & Co", "Strand Bookstore", "Blackwell's"]
            },
            {
                q: "Какое имя взял себе Джо Голдберг после переезда в Лос-Анджелес во 2 сезоне?",
                correct: "Уилл Беттельгейм",
                wrongs: ["Джонатан Мур", "Пол Кэмпбелл", "Сэм Смит"]
            },
            {
                q: "Кем работал Джо (под именем Джонатан Мур) в Лондоне в 4 сезоне?",
                correct: "Профессором литературы",
                wrongs: ["Библиотекарем", "Журналистом", "Барменом"]
            },
            {
                q: "Как зовут сына Джо Голдберга и Лав Куинн?",
                correct: "Генри",
                wrongs: ["Пако", "Оги", "Эллиот"]
            },
            {
                q: "Кто на самом деле оказался «Убийцей богатых» (Eat the Rich Killer) в 4 сезоне?",
                correct: "Сам Джо Голдберг (его альтер-эго)",
                wrongs: ["Рис Монтроуз", "Роальд", "Адам"]
            },
            {
                q: "Какова была настоящая профессия Лав Куинн при знакомстве с Джо?",
                correct: "Шеф-кондитер",
                wrongs: ["Актриса", "Владелица галереи", "Учительница"]
            },
            {
                q: "Какое название носила книга, написанная Бек в 1 сезоне?",
                correct: "Темно-зеленый (The Dark Face of Love)",
                wrongs: ["Ты", "Стеклянная клетка", "Книжник"]
            },
            {
                q: "Как Джо расправился с Лав Куинн в финале 3 сезона?",
                correct: "Отравил аконитом",
                wrongs: ["Запер в клетке", "Застрелил", "Утопил в бассейне"]
            }
        ];

        let questionsList = [];
        let currentQIndex = 0;
        let score = 0;
        let isAnswered = false;
        let soundEnabled = true;
        let volumeValue = 0.2;

        // Web Audio API для фоновой музыки и звуков
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgMusicGain = null;
        let isMusicPlaying = false;

        function initBackgroundMusic() {
            if (isMusicPlaying) return;
            bgMusicGain = audioCtx.createGain();
            bgMusicGain.gain.setValueAtTime(volumeValue, audioCtx.currentTime);
            bgMusicGain.connect(audioCtx.destination);

            const notes = [110, 116.54, 130.81, 123.47];
            let noteIdx = 0;

            setInterval(() => {
                if (!soundEnabled || volumeValue <= 0) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(volumeValue * 0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);

                osc.connect(gain);
                gain.connect(bgMusicGain);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.8);
                noteIdx++;
            }, 2000);

            isMusicPlaying = true;
        }

        function playSound(type) {
            if (!soundEnabled || volumeValue <= 0) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(volumeValue, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(volumeValue * 1.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(volumeValue * 1.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Алгоритм перемешивания Фишера — Йейтса
        function shuffle(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Подготовка вопросов (полная рандомизация вопросов и вариантов A, B, C, D)
        function prepareQuestions() {
            const shuffledRaw = shuffle(rawQuestions);
            questionsList = shuffledRaw.map(item => {
                const optionsRaw = [
                    { text: item.correct, isCorrect: true },
                    ...item.wrongs.map(w => ({ text: w, isCorrect: false }))
                ];
                return {
                    q: item.q,
                    options: shuffle(optionsRaw)
                };
            });
        }

        // Элементы интерфейса
        const questionBox = document.getElementById('questionBox');
        const answersGrid = document.getElementById('answersGrid');
        const questionNumText = document.getElementById('questionNumText');
        const scoreText = document.getElementById('scoreText');
        const questionsPill = document.getElementById('questionsPill');
        
        const soundSlider = document.getElementById('soundSlider');
        const soundIcon = document.getElementById('soundIcon');
        const infoModal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const modalAvatar = document.getElementById('modalAvatar');

        const lifeline5050 = document.getElementById('lifeline5050');
        const lifelineCall = document.getElementById('lifelineCall');
        const lifelineAudience = document.getElementById('lifelineAudience');

        // Отрисовка вопроса
        function renderQuestion() {
            isAnswered = false;
            const currentData = questionsList[currentQIndex];

            questionNumText.textContent = `ВОПРОС ${currentQIndex + 1}`;
            scoreText.textContent = `$${(currentQIndex + 1) * 100}`;
            questionsPill.textContent = `ВОПРОСОВ: ${questionsList.length}`;
            questionBox.textContent = currentData.q;

            answersGrid.innerHTML = '';
            const prefixes = ['A', 'B', 'C', 'D'];

            currentData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.dataset.isCorrect = opt.isCorrect;
                btn.dataset.index = idx;

                btn.innerHTML = `<span class="answer-prefix">${prefixes[idx]}:</span> ${opt.text}`;
                btn.addEventListener('click', () => handleAnswer(btn, opt.isCorrect));
                answersGrid.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn, isCorrect) {
            if (isAnswered) return;
            isAnswered = true;

            const buttons = answersGrid.querySelectorAll('.answer-btn');
            buttons.forEach(b => b.classList.add('disabled'));

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                playSound('correct');
                score += 100;
                setTimeout(() => {
                    currentQIndex = (currentQIndex + 1) % questionsList.length;
                    renderQuestion();
                }, 1200);
            } else {
                selectedBtn.classList.add('wrong');
                playSound('wrong');
                buttons.forEach(b => {
                    if (b.dataset.isCorrect === 'true') b.classList.add('correct');
                });
                setTimeout(() => {
                    showModal("Игра окончена", `Ваш результат: $${score}`, "💀");
                    restartGame();
                }, 1500);
            }
        }

        function restartGame() {
            score = 0;
            currentQIndex = 0;
            lifeline5050.classList.remove('used');
            lifelineCall.classList.remove('used');
            lifelineAudience.classList.remove('used');
            prepareQuestions();
            renderQuestion();
        }

        function showModal(title, text, avatar = "🧢") {
            modalTitle.textContent = title;
            modalBody.textContent = text;
            modalAvatar.textContent = avatar;
            infoModal.classList.add('active');
        }

        // Подсказка 50:50
        lifeline5050.addEventListener('click', () => {
            if (lifeline5050.classList.contains('used') || isAnswered) return;
            playSound('click');
            lifeline5050.classList.add('used');

            const buttons = Array.from(answersGrid.querySelectorAll('.answer-btn'));
            const wrongButtons = buttons.filter(b => b.dataset.isCorrect === 'false');
            const shuffledWrongs = shuffle(wrongButtons);
            shuffledWrongs.slice(0, 2).forEach(btn => btn.classList.add('hidden-opt'));
        });

        // Подсказка Звонок другу (Джо)
        lifelineCall.addEventListener('click', () => {
            if (lifelineCall.classList.contains('used') || isAnswered) return;
            playSound('click');
            lifelineCall.classList.add('used');

            const currentData = questionsList[currentQIndex];
            const correctOpt = currentData.options.find(o => o.isCorrect);
            const wrongOpts = currentData.options.filter(o => !o.isCorrect);

            const isAccurate = Math.random() < 0.6; // 60% точность
            const recommended = isAccurate ? correctOpt.text : wrongOpts[Math.floor(Math.random() * wrongOpts.length)].text;

            showModal("Звонок Джо Голсбергу", `«Привет, это я, Джо. Тут все просто… Думаю, правильный ответ — "${recommended}". Слушай свое сердце.»`, "🧢");
        });

        // Подсказка Помощь зала
        lifelineAudience.addEventListener('click', () => {
            if (lifelineAudience.classList.contains('used') || isAnswered) return;
            playSound('click');
            lifelineAudience.classList.add('used');

            const currentData = questionsList[currentQIndex];
            const correctOpt = currentData.options.find(o => o.isCorrect);
            showModal("Помощь зала", `Большинство зрителей в зале считают, что правильный вариант: "${correctOpt.text}".`, "👥");
        });

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            playSound('click');
            infoModal.classList.remove('active');
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            playSound('click');
            restartGame();
        });

        document.getElementById('resetHistoryBtn').addEventListener('click', () => {
            playSound('click');
            restartGame();
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            playSound('click');
            showModal("Настройки", "Здесь вы можете управлять звуком и громкостью через панель сверху.", "⚙️");
        });

        // Управление громкостью
        soundSlider.addEventListener('input', (e) => {
            volumeValue = parseFloat(e.target.value);
            if (bgMusicGain) {
                bgMusicGain.gain.setValueAtTime(volumeValue, audioCtx.currentTime);
            }
            if (volumeValue === 0) {
                soundEnabled = false;
                soundIcon.textContent = "🔇";
            } else {
                soundEnabled = true;
                soundIcon.textContent = "🔊";
            }
        });

        soundIcon.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if (!soundEnabled) {
                soundSlider.value = 0;
                volumeValue = 0;
                soundIcon.textContent = "🔇";
            } else {
                soundSlider.value = 0.2;
                volumeValue = 0.2;
                soundIcon.textContent = "🔊";
            }
            if (bgMusicGain) {
                bgMusicGain.gain.setValueAtTime(volumeValue, audioCtx.currentTime);
            }
        });

        // Активация аудио при первом клике на страницу
        document.body.addEventListener('click', () => {
            initBackgroundMusic();
        }, { once: true });

        // Старт при загрузке
        prepareQuestions();
        renderQuestion();
    </script>
</body>
</html>
